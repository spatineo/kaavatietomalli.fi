name: Bump Version on Release

on:
  release:
    types: [published]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Update Version Files
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Strip leading 'v' if tag is like 'v1.2.3'
          VERSION=${RELEASE_TAG#v}
          
          npm run update-app-version -- --version=$VERSION

      - name: Create Pull Request with Requested Reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          REVIEWER_USERNAME: "ilkkarinne"
        run: |
          BRANCH_NAME="chore/bump-version-${TAG_NAME}"

          # Configure Git Bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch, commit and push
          git checkout -b "$BRANCH_NAME"
          git commit -am "chore(release): bump version to ${TAG_NAME}"
          git push origin "$BRANCH_NAME"

          # Create Pull Request and assign reviewer
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --reviewer "$REVIEWER_USERNAME" \
            --title "chore(release): bump version to ${TAG_NAME}" \
            --body "Automated version bump in \`package.json\` and \`src/config.ts\` for release **${TAG_NAME}**. Please review and merge."