name: Nightly build & deploy (scheduled posts)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for newly publishable scheduled posts
        id: check
        run: npx tsx scripts/check-scheduled-posts.ts

      - name: Generate assets and search index
        if: steps.check.outputs.should_rebuild == 'true'
        run: npm run prebuild

      - name: Run unit tests
        if: steps.check.outputs.should_rebuild == 'true'
        run: npm run test:run

      - name: Install Playwright Browsers
        if: steps.check.outputs.should_rebuild == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        if: steps.check.outputs.should_rebuild == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: steps.check.outputs.should_rebuild == 'true' && !cancelled()
        with:
          name: playwright-report-scheduled
          path: playwright-report/
          retention-days: 30

      - name: Build
        if: steps.check.outputs.should_rebuild == 'true'
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PRELAUNCH_PASSWORD: ${{ secrets.VITE_PRELAUNCH_PASSWORD }}
      
      - name: Setup Pages
        if: steps.check.outputs.should_rebuild == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.check.outputs.should_rebuild == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.should_rebuild == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
