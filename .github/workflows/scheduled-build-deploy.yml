name: Nightly build & deploy (scheduled posts)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      # 1. Standard dependency installation
      - name: Install dependencies
        run: npm ci

      - name: Download Giscus stats
        run: npm run fetch-giscus-stats

      - name: Check for newly publishable scheduled posts and Giscus stats changes
        id: check
        run: npx tsx scripts/check-scheduled-posts.ts

      # 2. Get Playwright version for exact browser cache-key matching
      - name: Get Playwright version
        id: playwright-version
        if: steps.check.outputs.should_rebuild == 'true'
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      # 3. Cache Playwright browser binaries to make subsequent builds incredibly fast
      - name: Cache Playwright Browsers
        id: cache-playwright
        if: steps.check.outputs.should_rebuild == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}

      # 4. If cache misses, download Chromium and all necessary system libraries (os level dependencies)
      - name: Install Playwright Chromium Browser & OS Dependencies
        if: steps.check.outputs.should_rebuild == 'true' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # 5. If cache hits, we still need to make sure OS dependencies are mapped
      - name: Install Playwright OS Dependencies Only
        if: steps.check.outputs.should_rebuild == 'true' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      
      - name: Generate assets and search index
        if: steps.check.outputs.should_rebuild == 'true'
        run: npm run prebuild

      - name: Run unit tests
        if: steps.check.outputs.should_rebuild == 'true'
        run: npm run test:run

      - name: Run Playwright tests
        if: steps.check.outputs.should_rebuild == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: steps.check.outputs.should_rebuild == 'true' && !cancelled()
        with:
          name: playwright-report-scheduled
          path: playwright-report/
          retention-days: 30

      - name: Build
        if: steps.check.outputs.should_rebuild == 'true'
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PRELAUNCH_PASSWORD: ${{ secrets.VITE_PRELAUNCH_PASSWORD }}
      
      - name: Setup Pages
        if: steps.check.outputs.should_rebuild == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.check.outputs.should_rebuild == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.should_rebuild == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
