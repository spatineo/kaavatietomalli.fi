name: Nightly build & deploy (scheduled posts)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          fetch-depth: 0
      
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Validate Markdown content
        run: npm run validate-content

      - name: Cache Giscus stats
        id: cache-giscus-stats
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/content/giscus-stats.json
          key: giscus-stats-${{ steps.get-date.outputs.date }}

      - name: Download Giscus stats
        if: steps.cache-giscus-stats.outputs.cache-hit != 'true'
        run: npm run fetch-giscus-stats
      
      - name: Check for newly publishable scheduled posts and Giscus stats changes
        id: check
        run: npx tsx scripts/check-scheduled-posts.ts

      - name: Cache datamodels and codelists
        id: cache-data
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/data/suomi.fi
          key: suomi-data-${{ steps.get-date.outputs.date }}
          restore-keys: suomi-data-

      - name: Fetch datamodels and codelists, detect actual data changes
        id: fetch-data
        run: npm run fetch-data

      - name: Build
        if: steps.check.outputs.should_rebuild == 'true' || steps.fetch-data.outputs.data_changed == 'true'
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PRELAUNCH_PASSWORD: ${{ secrets.VITE_PRELAUNCH_PASSWORD }}

      # AWS CloudFront Deployment:
      ############################
      - name: Configure AWS Credentials (OIDC)
        if: steps.check.outputs.should_rebuild == 'true' || steps.fetch-data.outputs.data_changed == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_PROJECT_ACCOUNT_ID }}:role/${{ vars.DEPLOYER_ROLE }}
          aws-region: eu-north-1

      - name: Sync Site Output to S3
        if: steps.check.outputs.should_rebuild == 'true' || steps.fetch-data.outputs.data_changed == 'true'
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_SITE_BUCKET_NAME }} --delete \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Cache
        if: steps.check.outputs.should_rebuild == 'true' || steps.fetch-data.outputs.data_changed == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

