name: Nightly build & deploy (scheduled posts)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify app version consistency with the latest git tag
        run: npm run verify-app-version

      - name: Validate Markdown content
        run: npm run validate-content

      - name: Cache Giscus stats
        id: cache-giscus-stats
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/content/giscus-stats.json
          key: giscus-stats-${{ steps.get-date.outputs.date }}

      - name: Download Giscus stats
        if: steps.cache-giscus-stats.outputs.cache-hit != 'true'
        run: npm run fetch-giscus-stats
      
      - name: Check for newly publishable scheduled posts and Giscus stats changes
        id: check
        run: npx tsx scripts/check-scheduled-posts.ts

      - name: Restore cached datamodels and codelists
        id: restore-data
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/data/suomi.fi
          key: suomi-data-${{ steps.get-date.outputs.date }}
          restore-keys: suomi-data-

      - name: Fetch datamodels and codelists, detect actual data changes
        id: fetch-data
        run: npm run fetch-data

      - name: Save data model and codelists to cache if changed
        if: steps.fetch-data.outputs.data_changed == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/data/suomi.fi
          key: ${{ steps.restore-data.outputs.cache-primary-key }}
      
      - name: Build
        if: steps.check.outputs.should_rebuild == 'true' || steps.fetch-data.outputs.data_changed == 'true'
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PRELAUNCH_PASSWORD: ${{ secrets.VITE_PRELAUNCH_PASSWORD }}

      - name: Configure AWS Credentials (OIDC)
        if: steps.check.outputs.should_rebuild == 'true' || steps.fetch-data.outputs.data_changed == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_PROJECT_ACCOUNT_ID }}:role/${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }}-${{ vars.DEPLOYER_ROLE || 'GitHubActionsWebsiteDeployer' }}
          aws-region: eu-north-1

      - name: Fetch Infrastructure Resource IDs
        if: steps.check.outputs.should_rebuild == 'true' || steps.fetch-data.outputs.data_changed == 'true'
        id: describe-stack
        run: |

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.WEBSITE_STACK_NAME  || 'KaavatietomalliWebsiteMainStack'}} \
            --query "Stacks[0].Outputs[?OutputKey=='S3BucketName'].OutputValue" \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          echo "bucket_name=${BUCKET_NAME}" >> $GITHUB_OUTPUT
          echo "distribution_id=${DISTRIBUTION_ID}" >> $GITHUB_OUTPUT
      
      - name: Sync Site Assets to S3
        if: steps.check.outputs.should_rebuild == 'true' || steps.fetch-data.outputs.data_changed == 'true'
        run: |
          aws s3 sync dist/ s3://${{ steps.describe-stack.outputs.bucket_name }} \
            --delete \
            --size-only \
            --cache-control "public, max-age=31536000, immutable" \
            --include "assets/*"
      
      - name: Sync Site Content to S3    
        if: steps.check.outputs.should_rebuild == 'true' || steps.fetch-data.outputs.data_changed == 'true'
        run: |
          aws s3 sync dist/ s3://${{ steps.describe-stack.outputs.bucket_name }} \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "assets/*"

      - name: Invalidate CloudFront Cache
        if: steps.check.outputs.should_rebuild == 'true' || steps.fetch-data.outputs.data_changed == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.describe-stack.outputs.distribution_id }} \
            --paths "/*"
