name: PR Validation

on:
  pull_request:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to contents: read for safety
permissions:
  contents: read

# Allow concurrent runs for different PRs, but cancel previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 #v4.0.2
        with:
          filters: |
            code:
              - '!content/**'
      
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        if: steps.filter.outputs.code == 'true'
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium Browser & OS Dependencies
        if: steps.filter.outputs.code == 'true' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS Dependencies Only
        if: steps.filter.outputs.code == 'true' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Generate assets and search index (test-content mode)
        if: steps.filter.outputs.code == 'true'
        run: npm run prebuild
        env:
          CONTENT_MODE: test

      - name: Run unit tests
        if: steps.filter.outputs.code == 'true'
        run: npm run test:run
        env:
          CONTENT_MODE: test

      - name: Run Playwright tests
        if: steps.filter.outputs.code == 'true'
        run: npm run test:e2e
        env:
          CONTENT_MODE: test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: steps.filter.outputs.code == 'true' && !cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Validate Markdown content
        run: npm run validate-content

      - name: Prebuild
        if: steps.filter.outputs.code != 'true'
        run: npm run prebuild
        
      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PRELAUNCH_PASSWORD: ${{ secrets.VITE_PRELAUNCH_PASSWORD }}
