name: PR Validation

on:
  pull_request:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to contents: read for safety
permissions:
  contents: read

# Allow concurrent runs for different PRs, but cancel previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preconditions:
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
      code-changed: ${{ steps.change-flag.outputs.code_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify app version consistency with the latest git tag
        run: npm run verify-app-version
        
      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 #v4.0.2
        with:
          filters: |
            code:
              - '!content/**'
      
      - name: Save code change flag
        id: change-flag
        run: echo "code_changed=${{ steps.filter.outputs.code }}" >> $GITHUB_OUTPUT

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'] || require('./package.json').dependencies['@playwright/test'])" | sed 's/[^0-9.]//g')" >> $GITHUB_OUTPUT

  run-tests:
    needs: preconditions
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.preconditions.outputs.playwright-version }}-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        if: needs.preconditions.outputs.code-changed == 'true'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        if: needs.preconditions.outputs.code-changed == 'true'
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        if: needs.preconditions.outputs.code-changed == 'true'
        run: npm ci

      - name: Generate assets and search index (test-content mode)
        if: needs.preconditions.outputs.code-changed == 'true'
        run: npm run prepare:test

      - name: Run unit tests
        if: needs.preconditions.outputs.code-changed == 'true'
        run: npm run test:run
        env:
          CONTENT_MODE: test

      - name: Run Playwright tests
        if: needs.preconditions.outputs.code-changed == 'true'
        run: npm run test:e2e
        env:
          CONTENT_MODE: test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: needs.preconditions.outputs.code-changed == 'true' && !cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  validate:
    needs: [preconditions, run-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Markdown content
        run: npm run validate-content

      - name: Get Changed Markdown Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: content/**/*.md

      - name: Run Voikko Validation
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: npm run check-markdown-language
      
      - name: Build
        if: needs.preconditions.outputs.code-changed == 'true'
        run: npm run ci:validate
