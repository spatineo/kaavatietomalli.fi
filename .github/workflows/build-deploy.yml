name: Build and deploy site

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 #v4.0.2
        with:
          filters: |
            code:
              - 'e2e/**'
              - 'scripts/**'
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - 'project.config.ts'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
            infra:
              - 'bin/**'
              - 'cdk/**'
              - 'cdk.json'
              - 'package.json'
              - 'package-lock.json'
              - 'project.config.ts'
              - 'tsconfig.cdk.json'
      
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        if: steps.filter.outputs.code == 'true'
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium Browser & OS Dependencies
        if: steps.filter.outputs.code == 'true' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS Dependencies Only
        if: steps.filter.outputs.code == 'true' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Generate assets and search index (test-content mode)
        if: steps.filter.outputs.code == 'true'
        run: npm run prebuild
        env:
          CONTENT_MODE: test

      - name: Run unit tests
        if: steps.filter.outputs.code == 'true'
        run: npm run test:run
        env:
          CONTENT_MODE: test

      - name: Run Playwright tests
        if: steps.filter.outputs.code == 'true'
        run: npm run test:e2e
        env:
          CONTENT_MODE: test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: steps.filter.outputs.code == 'true' && !cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Validate Markdown content
        run: npm run validate-content
 
      - name: Cache datamodels and codelists
        id: cache-data
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/data/suomi.fi
          key: suomi-data-${{ steps.get-date.outputs.date }}

      - name: Fetch datamodels and codelists
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: npm run fetch-data

      - name: Cache Giscus stats
        id: cache-giscus-stats
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/content/giscus-stats.json
          key: giscus-stats-${{ steps.get-date.outputs.date }}

      - name: Download Giscus stats
        if: steps.cache-giscus-stats.outputs.cache-hit != 'true'
        run: npm run fetch-giscus-stats

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PRELAUNCH_PASSWORD: ${{ secrets.VITE_PRELAUNCH_PASSWORD }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_PROJECT_ACCOUNT_ID }}:role/${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }}-${{ vars.DEPLOYER_ROLE || ''}}
          aws-region: eu-north-1
      
      - name: Deploy CDK Infrastructure
        if: steps.filter.outputs.infra == 'true'
        env:
          AWS_PROJECT_ACCOUNT_ID: ${{ vars.AWS_PROJECT_ACCOUNT_ID }}
          DEPLOYER_ROLE: ${{ vars.DEPLOYER_ROLE }}
          VITE_PRELAUNCH_PASSWORD: ${{ secrets.VITE_PRELAUNCH_PASSWORD }} # For determining if we are in prod or pre-launch mode
          GIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }} # For auto-tagging the CDK stacks
          CERTIFICATE_STACK_NAME: ${{ vars. CERTIFICATE_STACK_NAME }}
          WEBSITE_STACK_NAME: ${{ vars.WEBSITE_STACK_NAME }}

        # Deploy both the cert and the website stacks:
        run: |
          npx cdk deploy --all \
            --outputs-file cdk-outputs.json \
            --require-approval never

      - name: Set Resource Variables (from cdk deploy outputs) 
        if: steps.filter.outputs.infra == 'true'
        run: |
          BUCKET_NAME=$(jq -r '.${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }}.S3BucketName' cdk-outputs.json)
          DIST_ID=$(jq -r '.${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }}.CloudFrontDistributionId' cdk-outputs.json)
          
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          echo "DISTRIBUTION_ID=$DIST_ID" >> $GITHUB_ENV
      
      - name: Set Resource Variables (from existing stack)
        if: steps.filter.outputs.infra != 'true'
        run: |

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }} \
            --query "Stacks[0].Outputs[?OutputKey=='S3BucketName'].OutputValue" \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          echo "BUCKET_NAME=${BUCKET_NAME}" >> $GITHUB_ENV
          echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}" >> $GITHUB_ENV

      - name: Sync Site Output to S3
        run: |
          aws s3 sync dist/ s3://${{ env.BUCKET_NAME }} --delete \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.DISTRIBUTION_ID }} \
            --paths "/*"
