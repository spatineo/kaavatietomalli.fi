name: Build and deploy site

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  preconditions:
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
      code-changed: ${{ steps.change-flag.outputs.code_changed }}
      infra-changed: ${{ steps.change-flag.outputs.infra_changed }}
      date: ${{ steps.get-date.outputs.date }}
    steps:
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 #v4.0.2
        with:
          filters: |
            code:
              - 'e2e/**'
              - 'scripts/**'
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - 'project.config.ts'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
            infra:
              - 'bin/**'
              - 'cdk/**'
              - 'cdk.json'
              - 'package.json'
              - 'package-lock.json'
              - 'project.config.ts'
              - 'tsconfig.cdk.json'
  
      - name: Save code change flags
        id: change-flag
        run: |
          echo "code_changed=${{ steps.filter.outputs.code }}" >> $GITHUB_OUTPUT
          echo "infra_changed=${{ steps.filter.outputs.infra }}" >> $GITHUB_OUTPUT

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'] || require('./package.json').dependencies['@playwright/test'])" | sed 's/[^0-9.]//g')" >> $GITHUB_OUTPUT
  
  run-tests:
    needs: preconditions
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.preconditions.outputs.playwright-version }}-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        if: needs.preconditions.outputs.code-changed == 'true'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        if: needs.preconditions.outputs.code-changed == 'true'
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        if: needs.preconditions.outputs.code-changed == 'true' && !cancelled()
        run: npm ci

      - name: Generate assets and search index (test-content mode)
        if: needs.preconditions.outputs.code-changed == 'true' && !cancelled()
        run: npm run prebuild
        env:
          CONTENT_MODE: test

      - name: Run unit tests
        if: needs.preconditions.outputs.code-changed == 'true' && !cancelled()
        run: npm run test:run
        env:
          CONTENT_MODE: test

      - name: Run e2e tests
        if: needs.preconditions.outputs.code-changed == 'true' && !cancelled()
        run: npm run test:e2e
        env:
          CONTENT_MODE: test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: needs.preconditions.outputs.code-changed == 'true' && !cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
  
  build-deploy:
    needs: [preconditions, run-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        if: '!cancelled()'
        run: npm ci

      - name: Validate Markdown content
        if: '!cancelled()'
        run: npm run validate-content
 
      - name: Restore cached datamodels and codelists
        id: restore-data
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: '!cancelled()'
        with:
          path: public/data/suomi.fi
          key: suomi-data-${{ needs.preconditions.outputs.date }}
          restore-keys: suomi-data-

      - name: Fetch datamodels and codelists
        id: fetch-data
        if: steps.restore-data.outputs.cache-hit != 'true' && !cancelled()
        run: npm run fetch-data

      - name: Save data model and codelists to cache if changed
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: steps.fetch-data.outputs.data_changed == 'true' && !cancelled()
        with:
          path: public/data/suomi.fi
          key: ${{ steps.restore-data.outputs.cache-primary-key }}

      - name: Cache Giscus stats
        id: cache-giscus-stats
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: '!cancelled()'
        with:
          path: public/content/giscus-stats.json
          key: giscus-stats-${{ needs.preconditions.outputs.date }}

      - name: Download Giscus stats
        if: steps.cache-giscus-stats.outputs.cache-hit != 'true' && !cancelled()
        run: npm run fetch-giscus-stats

      - name: Build
        if: '!cancelled()'
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PRELAUNCH_PASSWORD: ${{ secrets.VITE_PRELAUNCH_PASSWORD }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        if: '!cancelled()'
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_PROJECT_ACCOUNT_ID }}:role/${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }}-${{ vars.DEPLOYER_ROLE || 'GitHubActionsWebsiteDeployer'}}
          aws-region: eu-north-1
      
      - name: Deploy CDK Infrastructure
        if: needs.preconditions.outputs.infra-changed == 'true' && !cancelled()
        env:
          AWS_PROJECT_ACCOUNT_ID: ${{ vars.AWS_PROJECT_ACCOUNT_ID }}
          DEPLOYER_ROLE: ${{ vars.DEPLOYER_ROLE || 'GitHubActionsWebsiteDeployer' }}
          VITE_PRELAUNCH_PASSWORD: ${{ secrets.VITE_PRELAUNCH_PASSWORD }} # For determining if we are in prod or pre-launch mode
          GIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }} # For auto-tagging the CDK stacks
          CERTIFICATE_STACK_NAME: ${{ vars. CERTIFICATE_STACK_NAME || 'KaavatietomalliWebsiteCertStack' }}
          WEBSITE_STACK_NAME: ${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }}

        run: |
          npx cdk deploy --all \
            --outputs-file cdk-outputs.json \
            --require-approval never

      - name: Set Resource Variables (from cdk deploy outputs) 
        if: needs.preconditions.outputs.infra-changed == 'true' && !cancelled()
        run: |
          BUCKET_NAME=$(jq -r '.${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }}.S3BucketName' cdk-outputs.json)
          DIST_ID=$(jq -r '.${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }}.CloudFrontDistributionId' cdk-outputs.json)
          
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          echo "DISTRIBUTION_ID=$DIST_ID" >> $GITHUB_ENV
      
      - name: Set Resource Variables (from describe stack)
        if: needs.preconditions.outputs.infra-changed != 'true' && !cancelled()
        run: |

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }} \
            --query "Stacks[0].Outputs[?OutputKey=='S3BucketName'].OutputValue" \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.WEBSITE_STACK_NAME || 'KaavatietomalliWebsiteMainStack' }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          echo "BUCKET_NAME=${BUCKET_NAME}" >> $GITHUB_ENV
          echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}" >> $GITHUB_ENV

      - name: Sync Site Assets to S3
        if: '!cancelled()'
        run: |
          aws s3 sync dist/ s3://${{ env.BUCKET_NAME }} \
            --delete \
            --size-only \
            --cache-control "public, max-age=31536000, immutable" \
            --include "assets/*"
      
      - name: Sync Site Content to S3    
        if: '!cancelled()'
        run: |
          aws s3 sync dist/ s3://${{ env.BUCKET_NAME }} \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "assets/*"

      - name: Invalidate CloudFront Cache
        if: '!cancelled()'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.DISTRIBUTION_ID }} \
            --paths "/*"
