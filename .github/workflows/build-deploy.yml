name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 #v4.0.2
        with:
          filters: |
            code:
              - '!content/**'
      
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        if: steps.filter.outputs.code == 'true'
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: cache-playwright
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium Browser & OS Dependencies
        if: steps.filter.outputs.code == 'true' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS Dependencies Only
        if: steps.filter.outputs.code == 'true' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Generate assets and search index (test-content mode)
        if: steps.filter.outputs.code == 'true'
        run: npm run prebuild
        env:
          CONTENT_MODE: test

      - name: Run unit tests
        if: steps.filter.outputs.code == 'true'
        run: npm run test:run
        env:
          CONTENT_MODE: test

      - name: Run Playwright tests
        if: steps.filter.outputs.code == 'true'
        run: npm run test:e2e
        env:
          CONTENT_MODE: test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: steps.filter.outputs.code == 'true' && !cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Validate Markdown content
        run: npm run validate-content
 
      - name: Cache datamodels and codelists
        id: cache-data
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/data/suomi.fi
          key: suomi-data-${{ steps.get-date.outputs.date }}

      - name: Fetch datamodels and codelists
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: npm run fetch-data

      - name: Cache Giscus stats
        id: cache-giscus-stats
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/content/giscus-stats.json
          key: giscus-stats-${{ steps.get-date.outputs.date }}

      - name: Download Giscus stats
        if: steps.cache-giscus-stats.outputs.cache-hit != 'true'
        run: npm run fetch-giscus-stats

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PRELAUNCH_PASSWORD: ${{ secrets.VITE_PRELAUNCH_PASSWORD }}
      
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d #v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5.0.0
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 #v5.0.0
